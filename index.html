<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI海报 - 人工智能通识教育教学管理系统</title>
<style>
  :root {
    --primary: #0ea5e9;
    --primary-dark: #0284c7;
    --primary-soft: #e0f2fe;
    --accent: #f97316;
    --text: #0f172a;
    --text-soft: #64748b;
    --text-mute: #94a3b8;
    --border: #e2e8f0;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--surface-soft);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 14px 20px;
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  header .logo {
    width: 32px; height: 32px;
    background: var(--primary);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 13px;
  }
  header h1 { font-size: 16px; font-weight: 600; }

  .page { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .back {
    color: var(--primary);
    font-weight: 500;
    margin-bottom: 14px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    font-size: 14px;
  }

  .layout {
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 16px;
    background: var(--surface);
    border-radius: 8px;
    padding: 16px;
    border: 1px solid var(--border);
  }

  .panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  /* Toolbar */
  .toolbar {
    background: var(--surface-soft);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .name-edit {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex: 1;
    min-width: 0;
  }
  .name-edit input {
    border: none;
    background: transparent;
    outline: none;
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
    padding: 4px 6px;
    border-radius: 4px;
    width: 100%;
    min-width: 0;
  }
  .name-edit input::placeholder { color: var(--text-mute); }
  .name-edit input:hover, .name-edit input:focus {
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--border);
  }
  .name-edit input:focus { box-shadow: inset 0 0 0 1px var(--primary); }
  .name-edit .pencil { color: var(--text-mute); font-size: 12px; flex-shrink: 0; }
  .ratio-toggle {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px;
    gap: 2px;
  }
  .ratio-toggle button {
    border: none;
    background: transparent;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-soft);
    font-family: inherit;
  }
  .ratio-toggle button.active {
    background: var(--primary);
    color: white;
  }

  /* Prompt */
  .prompt-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .prompt-box .title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .prompt-box textarea {
    width: 100%;
    min-height: 120px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-size: 14px;
    resize: none;
    outline: none;
    font-family: inherit;
    color: var(--text);
    background: var(--surface-soft);
    transition: border-color 0.15s, background 0.15s;
  }
  .prompt-box textarea:focus {
    border-color: var(--primary);
    background: var(--surface);
  }
  .prompt-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    justify-content: flex-end;
  }
  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    width: 38px; height: 38px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--text-soft);
    font-family: inherit;
  }
  .icon-btn:hover { background: var(--surface-soft); }
  .icon-btn.recording {
    background: var(--danger);
    color: white;
    border-color: var(--danger);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  .send-btn {
    background: var(--primary) !important;
    color: white !important;
    border-color: var(--primary) !important;
    width: auto !important;
    padding: 0 18px;
    font-size: 14px !important;
    font-weight: 500;
    gap: 6px;
  }
  .send-btn:hover { background: var(--primary-dark) !important; }
  .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Section labels */
  .section-label {
    font-size: 13px;
    color: var(--text-soft);
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Style grid */
  .styles-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .style-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-soft);
    font-family: inherit;
  }
  .style-card .emoji { font-size: 22px; display: block; margin-bottom: 4px; }
  .style-card.active {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-weight: 600;
  }
  .style-card:hover:not(.active) {
    border-color: var(--text-mute);
  }

  /* Examples */
  .example-item {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-soft);
  }
  .example-item:hover {
    border-color: var(--primary);
    background: var(--surface);
  }
  .example-item strong { color: var(--text); font-weight: 600; }

  /* Canvas */
  .canvas {
    background: var(--surface-soft);
    border: 1px dashed var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: auto;
    min-height: 520px;
    gap: 12px;
  }
  .canvas-empty {
    color: var(--text-mute);
    font-size: 14px;
    text-align: center;
    line-height: 1.8;
  }
  .canvas-empty .big { font-size: 48px; margin-bottom: 12px; }

  .poster-wrap {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    max-width: 100%;
  }
  .poster-wrap img {
    display: block;
    max-width: 100%;
    max-height: 60vh;
    user-select: none;
  }

  .poster-text {
    position: absolute;
    transform: translate(-50%, -50%);
    font-weight: 700;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    white-space: pre-wrap;
    text-align: center;
    user-select: none;
    line-height: 1.2;
    letter-spacing: 0.05em;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35), 0 0 2px rgba(0,0,0,0.5);
    max-width: 90%;
    word-break: break-word;
  }
  .poster-text.editing {
    outline: 1px dashed var(--primary);
    outline-offset: 4px;
    cursor: move;
    touch-action: none;
  }

  .poster-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .poster-actions button {
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 6px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
  }
  .poster-actions button:hover { background: var(--surface-soft); }
  .poster-actions .primary {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .poster-actions .primary:hover { background: var(--primary-dark); }

  .text-editor {
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 560px;
  }
  .text-editor input[type="text"] {
    flex: 1;
    min-width: 120px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .text-editor input[type="text"]:focus { border-color: var(--primary); }
  .text-editor .ctrl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-soft); }
  .text-editor input[type="range"] { width: 80px; }
  .color-swatches { display: flex; gap: 4px; }
  .color-swatches button {
    width: 22px; height: 22px;
    border: 2px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    padding: 0;
  }
  .color-swatches button.active {
    border-color: var(--primary);
    transform: scale(1.15);
  }

  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    color: var(--primary);
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--primary-soft);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .quota {
    font-size: 12px;
    color: var(--text-mute);
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px;
  }
  .tabs button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-soft);
    font-family: inherit;
    font-weight: 500;
  }
  .tabs button.active {
    background: var(--surface);
    color: var(--primary);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }

  .tab-panel { display: none; flex-direction: column; gap: 14px; }
  .tab-panel.active { display: flex; }

  /* Gallery */
  .gallery-filter {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .gallery-filter button {
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 4px 12px;
    border-radius: 14px;
    font-size: 12px;
    color: var(--text-soft);
    cursor: pointer;
    font-family: inherit;
  }
  .gallery-filter button.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .gallery-item {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    background: var(--surface);
    aspect-ratio: 3 / 4;
    position: relative;
  }
  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .gallery-item:hover { border-color: var(--primary); }
  .gallery-item .tag {
    position: absolute;
    bottom: 6px; left: 6px;
    background: rgba(15, 23, 42, 0.75);
    color: white;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
  }
  .gallery-empty {
    grid-column: 1 / -1;
    padding: 30px 12px;
    text-align: center;
    color: var(--text-mute);
    font-size: 13px;
    background: var(--surface-soft);
    border: 1px dashed var(--border);
    border-radius: 6px;
  }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: white;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--danger); }

  /* Header settings button */
  header .settings-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--text-soft);
    cursor: pointer;
    font-family: inherit;
  }
  header .settings-btn:hover { background: var(--surface-soft); }

  /* Modal */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 10px;
    padding: 20px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  }
  .modal h3 {
    font-size: 16px;
    margin-bottom: 8px;
  }
  .modal .desc {
    font-size: 13px;
    color: var(--text-soft);
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .modal .desc code {
    background: var(--surface-soft);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
  }
  .modal input[type="password"],
  .modal input[type="text"] {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    font-family: monospace;
  }
  .modal input:focus { border-color: var(--primary); }
  .modal .status {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 8px;
    min-height: 16px;
  }
  .modal .actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .modal .actions button {
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
  }
  .modal .actions button:hover { background: var(--surface-soft); }
  .modal .actions button.primary {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .modal .actions button.primary:hover { background: var(--primary-dark); }
  .modal .actions button.danger {
    color: var(--danger);
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 900px) {
    header { padding: 12px 16px; }
    header h1 { font-size: 15px; }
    .page { padding: 12px; }
    .layout {
      grid-template-columns: 1fr;
      padding: 12px;
      gap: 12px;
    }
    .canvas {
      min-height: 360px;
      order: -1; /* canvas on top for mobile */
    }
    .poster-wrap img { max-height: 50vh; }
  }

  @media (max-width: 480px) {
    header .logo { width: 28px; height: 28px; font-size: 12px; }
    header h1 { font-size: 14px; }
    .toolbar { flex-wrap: wrap; gap: 8px; padding: 8px 10px; }
    .toolbar .name { width: 100%; }
    .styles-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .style-card { padding: 8px 4px; font-size: 11px; }
    .style-card .emoji { font-size: 20px; }
    .prompt-box textarea { min-height: 100px; font-size: 16px; /* prevent iOS zoom */ }
    .example-item { font-size: 12px; padding: 8px 10px; }
    .canvas { padding: 14px; min-height: 300px; }
    .poster-wrap img { max-height: 45vh; }
    .ratio-toggle button { padding: 6px 10px; font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">AI</div>
  <h1>人工智能通识教育教学管理系统</h1>
  <button class="settings-btn" id="settingsBtn" title="配置 API Key">⚙️ 设置</button>
</header>

<div class="page">
  <div class="layout">
    <!-- LEFT PANEL -->
    <div class="panel">
      <!-- Tabs (顶部) -->
      <div class="tabs" id="tabs">
        <button data-tab="create" class="active">✍️ AI 创作</button>
        <button data-tab="gallery">🖼️ 精选图库</button>
      </div>

      <!-- Toolbar: name + ratio -->
      <div class="toolbar">
        <label class="name-edit">
          <input type="text" id="posterName" placeholder="给作品起个名字" maxlength="20">
          <span class="pencil">✎</span>
        </label>
        <div class="ratio-toggle" id="ratioToggle">
          <button data-ratio="portrait" class="active">竖版</button>
          <button data-ratio="landscape">横版</button>
        </div>
      </div>

      <!-- Tab: Create -->
      <div class="tab-panel active" data-panel="create">
        <!-- Prompt -->
        <div class="prompt-box">
          <div class="title">输入提示词,AI 帮你生成海报</div>
          <textarea id="promptInput" placeholder="比如:一只戴着宇航员头盔的小猫在月球上跳舞..."></textarea>
          <div class="prompt-actions">
            <button id="voiceBtn" class="icon-btn" title="语音输入">🎙️</button>
            <button id="sendBtn" class="icon-btn send-btn" title="生成">生成 →</button>
          </div>
        </div>

        <!-- Style picker -->
        <div>
          <div class="section-label">选择风格</div>
          <div class="styles-grid" id="styleGrid"></div>
        </div>

        <div class="quota">模型: GPT-Image-2 · 生成约需 15-30 秒</div>

        <!-- Examples -->
        <div>
          <div class="section-label">试试这些示例</div>
          <div class="example-item" data-example="动漫的天空图片,草地地平线,孩子奔跑在远处的草地">
            <strong>示例 1:</strong> 动漫的天空,草地地平线,孩子奔跑在远处
          </div>
          <div class="example-item" data-example="可爱卡通3D小狗的图片,暖色,毛茸茸歪着头伸舌头,毛发蓬松,电影画面质感">
            <strong>示例 2:</strong> 3D 卡通小狗,暖色,毛茸茸歪着头伸舌头
          </div>
          <div class="example-item" data-example="水墨画风格的山水,远山如黛,一叶扁舟,意境悠远">
            <strong>示例 3:</strong> 水墨山水,远山如黛,一叶扁舟
          </div>
        </div>
      </div>

      <!-- Tab: Gallery -->
      <div class="tab-panel" data-panel="gallery">
        <div class="section-label">从精选图库挑一张</div>
        <div class="gallery-filter" id="galleryFilter"></div>
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>
    </div>
    </div>

    <!-- RIGHT CANVAS -->
    <div class="canvas" id="canvas">
      <div class="canvas-empty">
        <div class="big">🎨</div>
        <div>在左侧输入你的创意<br>AI 帮你生成独一无二的海报</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Settings Modal -->
<div class="modal-mask" id="settingsModal">
  <div class="modal">
    <h3>API Key 配置</h3>
    <div class="desc">
      请在 <a href="https://302.ai" target="_blank" style="color:var(--primary)">302.ai</a> 注册并充值后,将 API Key 填入下方。<br>
      Key 仅保存在本机浏览器中 (<code>localStorage</code>),不会上传。
    </div>
    <input type="password" id="apiKeyInput" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off">
    <div class="status" id="apiKeyStatus"></div>
    <div class="actions">
      <button id="apiKeyClear" class="danger">清除</button>
      <button id="apiKeyCancel">取消</button>
      <button id="apiKeySave" class="primary">保存</button>
    </div>
  </div>
</div>

<script>
// ============== CONFIG ==============
const API_URL = "https://api.302.ai/302/images/generations";
const MODEL = "gpt-image-2";
const KEY_STORAGE = "ai_poster_302_key";

// 读取顺序: URL 参数 ?key=xxx > localStorage
function getApiKey() {
  const urlKey = new URLSearchParams(location.search).get("key");
  if (urlKey) {
    localStorage.setItem(KEY_STORAGE, urlKey);
    // 从 URL 中移除 key,避免被意外分享
    const u = new URL(location.href);
    u.searchParams.delete("key");
    history.replaceState(null, "", u.toString());
    return urlKey;
  }
  return localStorage.getItem(KEY_STORAGE) || "";
}

const STYLES = [
  { id: "none",      name: "自由发挥", emoji: "✨", prompt: "" },

// ============== GALLERY ==============
let galleryFilter = "all";

function renderGalleryFilters() {
  const wrap = document.getElementById("galleryFilter");
  wrap.innerHTML = "";
  GALLERY_FILTERS.forEach(f => {
    const b = document.createElement("button");
    b.textContent = f.name;
    b.className = f.id === galleryFilter ? "active" : "";
    b.onclick = () => {
      galleryFilter = f.id;
      renderGalleryFilters();
      renderGallery();
    };
    wrap.appendChild(b);
  });
}

function renderGallery() {
  const grid = document.getElementById("galleryGrid");
  grid.innerHTML = "";
  const items = galleryFilter === "all"
    ? GALLERY
    : GALLERY.filter(g => g.style === galleryFilter);

  if (items.length === 0) {
    grid.innerHTML = `<div class="gallery-empty">这个分类还没有素材</div>`;
    return;
  }

  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "gallery-item";
    div.innerHTML = `
      <img src="${item.src}" alt="${item.title}" loading="lazy"
           onerror="this.parentNode.innerHTML='<div style=\\'padding:20px;text-align:center;color:#94a3b8;font-size:12px;display:flex;align-items:center;justify-content:center;height:100%;\\'>素材加载中<br>(开课前会补齐)</div>'">
      <span class="tag">${item.title}</span>`;
    div.onclick = () => renderPoster(item.src, "gallery");
    grid.appendChild(div);
  });
}

renderGalleryFilters();
renderGallery();

// ============== TOAST ==============
function toast(msg, type = "info") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (type === "error" ? " error" : "");
  setTimeout(() => t.classList.remove("show"), 2800);
}

// ============== VOICE INPUT ==============
const voiceBtn = document.getElementById("voiceBtn");
const promptInput = document.getElementById("promptInput");
let recognition = null;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognition = new SR();
  recognition.lang = "zh-CN";
  recognition.continuous = false;
  recognition.interimResults = true;

  let finalText = "";
  recognition.onstart = () => {
    voiceBtn.classList.add("recording");
    finalText = promptInput.value;
  };
  recognition.onresult = (e) => {
    let interim = "";
    let finalPart = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalPart += r[0].transcript;
      else interim += r[0].transcript;
    }
    promptInput.value = finalText + finalPart + interim;
  };
  recognition.onerror = (e) => {
    voiceBtn.classList.remove("recording");
    if (e.error === "not-allowed") toast("请允许使用麦克风", "error");
    else toast("语音识别出错: " + e.error, "error");
  };
  recognition.onend = () => {
    voiceBtn.classList.remove("recording");
  };
} else {
  voiceBtn.disabled = true;
  voiceBtn.title = "当前浏览器不支持语音输入";
  voiceBtn.style.opacity = "0.4";
}

voiceBtn.onclick = () => {
  if (!recognition) return;
  if (voiceBtn.classList.contains("recording")) {
    recognition.stop();
  } else {
    try { recognition.start(); }
    catch (err) { toast("请稍后再试", "error"); }
  }
};

// ============== GENERATE ==============
const sendBtn = document.getElementById("sendBtn");
const canvas = document.getElementById("canvas");

function buildPrompt(userText) {
  const style = STYLES.find(s => s.id === currentStyle);
  const parts = [userText.trim()];
  if (style && style.prompt) parts.push(style.prompt);
  parts.push(NEGATIVE_HINTS);
  // 注入轻微随机性,避免千篇一律
  const seeds = ["丰富的细节", "独特的构图", "富有创意的视角", "鲜明的主体"];
  parts.push(seeds[Math.floor(Math.random() * seeds.length)]);
  return parts.join(",");
}

function renderLoading() {
  canvas.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>AI 正在作画,大约需要 15-30 秒...</div>
    </div>`;
}

function renderPoster(imgUrl, source) {
  currentImageUrl = imgUrl;
  currentSource = source || currentSource || "ai";
  textOverlay = null;
  drawCanvas();
}

function drawCanvas() {
  if (!currentImageUrl) return;
  const changeBtnLabel = currentSource === "gallery" ? "🖼️ 换一张" : "🔄 再来一张";
  const textBlock = textOverlay ? `
    <div class="poster-text" id="posterText" style="
      left: ${textOverlay.xPct}%;
      top: ${textOverlay.yPct}%;
      font-size: ${textOverlay.sizePct}%;
      color: ${textOverlay.color};
    ">${escapeHtml(textOverlay.text || "点击下方输入文字")}</div>` : "";

  canvas.innerHTML = `
    <div class="poster-wrap" id="posterWrap">
      <img id="posterImg" src="${currentImageUrl}" alt="海报" crossorigin="anonymous">
      ${textBlock}
    </div>
    <div class="poster-actions">
      <button id="textBtn">${textOverlay ? "✎ 编辑文字" : "✎ 加文字"}</button>
      <button id="downloadBtn" class="primary">💾 下载</button>
      <button id="changeBtn">${changeBtnLabel}</button>
    </div>
    <div id="textEditorMount"></div>`;

  document.getElementById("textBtn").onclick = openTextEditor;
  document.getElementById("downloadBtn").onclick = () => downloadImage(currentImageUrl);
  document.getElementById("changeBtn").onclick = () => {
    if (currentSource === "gallery") {
      document.querySelector('#tabs button[data-tab="gallery"]').click();
    } else {
      sendBtn.click();
    }
  };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  })[c]);
}

function openTextEditor() {
  if (!textOverlay) {
    textOverlay = { text: "", xPct: 50, yPct: 85, sizePct: 8, color: "#ffffff" };
  }
  drawCanvas();
  const textEl = document.getElementById("posterText");
  textEl.classList.add("editing");
  enableDragText(textEl);

  const mount = document.getElementById("textEditorMount");
  const colors = ["#ffffff", "#000000", "#ef4444", "#facc15"];
  mount.innerHTML = `
    <div class="text-editor">
      <input type="text" id="textInput" placeholder="输入文字 (如:我的太空梦)" value="${escapeHtml(textOverlay.text)}" maxlength="20">
      <div class="ctrl">字号
        <input type="range" id="textSize" min="4" max="20" step="0.5" value="${textOverlay.sizePct}">
      </div>
      <div class="ctrl">颜色
        <div class="color-swatches" id="colorSwatches">
          ${colors.map(c => `<button data-color="${c}" style="background:${c}" class="${c === textOverlay.color ? 'active' : ''}"></button>`).join("")}
        </div>
      </div>
      <button id="textDone" class="primary" style="padding:7px 14px;border:1px solid var(--primary);background:var(--primary);color:white;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;">完成</button>
      <button id="textDel" style="padding:7px 12px;border:1px solid var(--border);background:var(--surface);border-radius:6px;font-size:13px;color:var(--danger);cursor:pointer;font-family:inherit;">删除</button>
    </div>`;

  const input = document.getElementById("textInput");
  input.oninput = () => {
    textOverlay.text = input.value;
    textEl.textContent = input.value || "点击下方输入文字";
  };
  document.getElementById("textSize").oninput = (e) => {
    textOverlay.sizePct = parseFloat(e.target.value);
    textEl.style.fontSize = textOverlay.sizePct + "%";
  };
  document.querySelectorAll("#colorSwatches button").forEach(b => {
    b.onclick = () => {
      textOverlay.color = b.dataset.color;
      textEl.style.color = b.dataset.color;
      document.querySelectorAll("#colorSwatches button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
    };
  });
  document.getElementById("textDone").onclick = () => {
    if (!textOverlay.text.trim()) { textOverlay = null; }
    drawCanvas();
  };
  document.getElementById("textDel").onclick = () => {
    textOverlay = null;
    drawCanvas();
  };
  input.focus();
}

function enableDragText(el) {
  const wrap = document.getElementById("posterWrap");
  let dragging = false;
  const start = (e) => {
    dragging = true;
    e.preventDefault();
  };
  const move = (e) => {
    if (!dragging) return;
    const rect = wrap.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    const x = ((p.clientX - rect.left) / rect.width) * 100;
    const y = ((p.clientY - rect.top) / rect.height) * 100;
    textOverlay.xPct = Math.max(5, Math.min(95, x));
    textOverlay.yPct = Math.max(5, Math.min(95, y));
    el.style.left = textOverlay.xPct + "%";
    el.style.top = textOverlay.yPct + "%";
  };
  const end = () => { dragging = false; };
  el.addEventListener("mousedown", start);
  el.addEventListener("touchstart", start, { passive: false });
  window.addEventListener("mousemove", move);
  window.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("mouseup", end);
  window.addEventListener("touchend", end);
}

async function downloadImage(url) {
  try {
    const img = new Image();
    img.crossOrigin = "anonymous";
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error("图片加载失败"));
      img.src = url;
    });

    const c = document.createElement("canvas");
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0);

    if (textOverlay && textOverlay.text.trim()) {
      const fontSizePx = (textOverlay.sizePct / 100) * c.height;
      ctx.font = `700 ${fontSizePx}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const x = (textOverlay.xPct / 100) * c.width;
      const y = (textOverlay.yPct / 100) * c.height;
      ctx.shadowColor = "rgba(0,0,0,0.5)";
      ctx.shadowBlur = fontSizePx * 0.15;
      ctx.shadowOffsetY = fontSizePx * 0.04;
      ctx.fillStyle = textOverlay.color;
      ctx.fillText(textOverlay.text, x, y);
    }

    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    const customName = document.getElementById("posterName").value.trim();
    const safeName = customName.replace(/[\\/:*?"<>|]/g, "").slice(0, 20);
    const filename = safeName ? `${safeName}.png` : `poster_${Date.now()}.png`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
    toast("已下载: " + filename);
  } catch (e) {
    console.error(e);
    toast("下载失败,请长按图片保存", "error");
  }
}

async function generate() {
  if (isGenerating) return;
  const userText = promptInput.value.trim();
  if (!userText) {
    toast("请先输入提示词~", "error");
    return;
  }
  const apiKey = getApiKey();
  if (!apiKey) {
    toast("请先在右上角 ⚙️ 设置中配置 API Key", "error");
    openSettings();
    return;
  }

  isGenerating = true;
  sendBtn.disabled = true;
  renderLoading();

  const size = currentRatio === "portrait" ? "1024x1536" : "1536x1024";
  const fullPrompt = buildPrompt(userText);

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + apiKey,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        prompt: fullPrompt,
        n: 1,
        size: size,
        quality: "medium",
        response_format: "url"
      })
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`HTTP ${res.status}: ${errText.slice(0, 200)}`);
    }

    const data = await res.json();
    const item = data?.data?.[0];
    const imgUrl = item?.url || (item?.b64_json ? "data:image/png;base64," + item.b64_json : null);

    if (!imgUrl) throw new Error("返回数据格式异常");
    renderPoster(imgUrl, "ai");
    toast("生成成功!");
  } catch (err) {
    console.error(err);
    canvas.innerHTML = `
      <div class="canvas-empty">
        <div class="big">😿</div>
        <div>生成失败了,换个提示词再试试<br>
          <small style="color:#c55">${err.message}</small><br><br>
          <a href="#" id="fallbackLink" style="color:var(--primary);text-decoration:underline;">或从精选图库挑一张 →</a>
        </div>
      </div>`;
    document.getElementById("fallbackLink").onclick = (e) => {
      e.preventDefault();
      document.querySelector('#tabs button[data-tab="gallery"]').click();
    };
    toast("生成失败: " + err.message, "error");
  } finally {
    isGenerating = false;
    sendBtn.disabled = false;
  }
}

sendBtn.onclick = generate;
promptInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) generate();
});

// ============== SETTINGS MODAL ==============
const settingsModal = document.getElementById("settingsModal");
const apiKeyInput = document.getElementById("apiKeyInput");
const apiKeyStatus = document.getElementById("apiKeyStatus");

function openSettings() {
  const key = localStorage.getItem(KEY_STORAGE) || "";
  apiKeyInput.value = key;
  apiKeyStatus.textContent = key ? "当前已配置 Key" : "尚未配置";
  apiKeyStatus.style.color = key ? "#10b981" : "var(--text-soft)";
  settingsModal.classList.add("show");
  setTimeout(() => apiKeyInput.focus(), 50);
}

function closeSettings() {
  settingsModal.classList.remove("show");
}

document.getElementById("settingsBtn").onclick = openSettings;
document.getElementById("apiKeyCancel").onclick = closeSettings;
settingsModal.onclick = (e) => {
  if (e.target === settingsModal) closeSettings();
};

document.getElementById("apiKeySave").onclick = () => {
  const v = apiKeyInput.value.trim();
  if (!v) {
    apiKeyStatus.textContent = "请输入 Key";
    apiKeyStatus.style.color = "var(--danger)";
    return;
  }
  localStorage.setItem(KEY_STORAGE, v);
  toast("已保存,可以开始创作啦");
  closeSettings();
};

document.getElementById("apiKeyClear").onclick = () => {
  if (!confirm("确定要清除本机保存的 API Key 吗?")) return;
  localStorage.removeItem(KEY_STORAGE);
  apiKeyInput.value = "";
  apiKeyStatus.textContent = "已清除";
  apiKeyStatus.style.color = "var(--text-soft)";
  toast("Key 已清除");
};

// 首次访问且未配置 key 时,自动弹出设置
if (!getApiKey()) {
  setTimeout(openSettings, 300);
}
</script>
